name: iOS macOS (manual, autorización de minutos)
on:
  workflow_dispatch:
    inputs:
      authorize_macos_minutes:
        description: 'He revisado disponibilidad/costo y autorizo esta ejecución macOS sin firma'
        required: true
        default: false
        type: boolean
  pull_request:
    types: [labeled]
permissions:
  contents: read
concurrency:
  group: ios-macos-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  simulator:
    # The label is an explicit spend authorization for this event, never reused on synchronize.
    # Only the owner, same-repository code and the designated iOS branch may authorize it.
    if: >-
      github.actor == github.repository_owner &&
      ((github.event_name == 'workflow_dispatch' && inputs.authorize_macos_minutes == true && github.ref == 'refs/heads/feature/datacore-ios') ||
       (github.event_name == 'pull_request' && github.event.action == 'labeled' && github.event.label.name == 'ios-macos-cost-approved' && github.event.pull_request.head.repo.full_name == github.repository && github.event.pull_request.head.ref == 'feature/datacore-ios'))
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_26.3.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify selected Xcode exists (never silently substitute)
        run: |
          test -d "$DEVELOPER_DIR"
          xcodebuild -version
      - name: Test two iPhones, capture XCTest/logs and build unsigned Release
        run: bash ios/tools/run_simulator_tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: ios-evidence/
          retention-days: 7
          if-no-files-found: warn
