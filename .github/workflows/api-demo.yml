name: API y dominio iOS sin macOS
on:
  push:
    paths: ['api/**', 'contracts/**', 'ios/**', '.github/workflows/api-demo.yml']
  pull_request:
    paths: ['api/**', 'contracts/**', 'ios/**', '.github/workflows/api-demo.yml']
permissions:
  contents: read
concurrency:
  group: ios-core-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  api:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: api/constraints-tested.txt
      - run: python -m pip install -c api/constraints-tested.txt -r api/requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s api/tests -v
      - run: python ios/tools/verify_project.py
      - run: python scripts/check_api_contract.py
      - run: python -m compileall -q api ios/tools
      - run: git diff --check
  swift-domain:
    runs-on: ubuntu-latest
    container: swift:6.0.3-jammy
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path ios/Packages/DataCoreDomain
      - name: SwiftUI syntax only (does not compile iOS)
        run: swiftc -frontend -parse ios/DataCoreAI/Sources/*.swift ios/DataCoreAITests/*.swift ios/DataCoreAIUITests/*.swift
