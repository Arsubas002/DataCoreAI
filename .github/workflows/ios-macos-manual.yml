name: iOS macOS (manual, autorización de minutos)
on:
  workflow_dispatch:
    inputs:
      authorize_macos_minutes:
        description: 'He revisado disponibilidad/costo y autorizo esta ejecución macOS sin firma'
        required: true
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  simulator:
    if: ${{ inputs.authorize_macos_minutes == true }}
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - uses: actions/checkout@v4
      - name: Verify selected toolchain
        run: xcodebuild -version
      - run: python3 ios/tools/verify_project.py
      - run: swift test --package-path ios/Packages/DataCoreDomain
      - name: Select an installed iPhone simulator
        run: |
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import sys,json; d=[v for rows in json.load(sys.stdin)["devices"].values() for v in rows if v["name"].startswith("iPhone")]; assert d,"No iPhone simulator installed"; print(next((v for v in d if v["name"]=="iPhone 16"), d[0])["udid"])')
          echo "DATACORE_SIMULATOR_ID=$DEVICE_ID" >> "$GITHUB_ENV"
      - name: Compile and test app, exports and six screens without signing
        run: |
          xcodebuild test -project ios/DataCoreAI.xcodeproj -scheme DataCoreAI -configuration Debug -destination "platform=iOS Simulator,id=$DATACORE_SIMULATOR_ID" -resultBundlePath ios-test-results.xcresult CODE_SIGNING_ALLOWED=NO
      - name: Verify Release simulator build (not an archive or App Store signature)
        run: |
          xcodebuild build -project ios/DataCoreAI.xcodeproj -scheme DataCoreAI -configuration Release -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO
      - name: Export captured simulator attachments
        if: always()
        run: |
          if [ -d ios-test-results.xcresult ]; then
            xcrun xcresulttool export attachments --path ios-test-results.xcresult --output-path ios-simulator-captures
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ios-simulator-evidence
          path: |
            ios-test-results.xcresult
            ios-simulator-captures
          if-no-files-found: warn
