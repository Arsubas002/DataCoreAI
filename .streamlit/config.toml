[theme]
base = "light"
primaryColor = "#7659E8"
backgroundColor = "#F2F5FA"
secondaryBackgroundColor = "#EAF0F7"
textColor = "#0D1726"
font = "sans serif"
baseFontSize = 15
baseRadius = "0.7rem"
buttonRadius = "0.55rem"
borderColor = "#DCE3EE"
showWidgetBorder = true
showSidebarBorder = false
headingFontSizes = ["2.2rem", "1.5rem", "1.15rem", "1rem", "0.9rem", "0.8rem"]
headingFontWeights = [700,650,600,600,600,600]
dataframeBorderColor = "#E2E8F1"
dataframeHeaderBackgroundColor = "#EAF0F7"
dataframeHeaderTextColor = "#465770"
blueColor = "#7659E8"
blueBackgroundColor = "#F0ECFF"
blueTextColor = "#51428E"
greenColor = "#128D88"
greenBackgroundColor = "#E1F7F4"
redColor = "#B74F6E"
redBackgroundColor = "#FCECF1"
yellowColor = "#917424"
yellowBackgroundColor = "#FFF5D8"
chartCategoricalColors = ["#7659E8", "#24C9C0", "#A397DC", "#8CA5BE"]

[theme.sidebar]
backgroundColor = "#0D1726"
secondaryBackgroundColor = "#19283D"
textColor = "#F2F5FA"
primaryColor = "#24C9C0"
borderColor = "#304057"

[server]
headless = true
address = "127.0.0.1"
[browser]
gatherUsageStats = false
