<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#102b35"><meta name="description" content="DataCore AI, demostración móvil sin datos reales"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" href="./icon.svg" type="image/svg+xml"><title>DataCore AI · Demo</title><style>
:root{font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color-scheme:dark;background:#08191f;color:#eaf4f5;--bg:#08191f;--surface:#102830;--surface2:#173640;--line:#2c4b52;--accent:#5de1c3;--muted:#a3bbc0}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 85% 0%,#15383f 0,transparent 32%),var(--bg)}header{padding:calc(20px + env(safe-area-inset-top)) 20px 20px;background:linear-gradient(135deg,#102f37,#0d232c);border-bottom:1px solid var(--line)}.brand{font-size:11px;letter-spacing:.17em;text-transform:uppercase;color:var(--accent);font-weight:700}.heading{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:27px;letter-spacing:-.04em;margin:7px 0 3px}h2{font-size:22px;letter-spacing:-.035em;margin:0 0 18px}.muted,small{color:var(--muted)}.status{font-size:11px;font-weight:700;color:#7cf0d3;border:1px solid #32675f;background:#123a39;padding:7px 10px;border-radius:999px;white-space:nowrap}main{padding:22px 18px 110px;max-width:1040px;margin:auto}.banner{padding:12px 15px;border:1px solid #36575c;border-left:3px solid var(--accent);border-radius:11px;background:#112c33;margin-bottom:23px;color:#c1d7da;font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.card{background:linear-gradient(155deg,var(--surface2),var(--surface));border:1px solid var(--line);border-radius:17px;padding:18px;min-width:0;line-height:1.45;box-shadow:0 8px 22px #00000014}.card strong{display:block;font-size:clamp(22px,4vw,34px);letter-spacing:-.04em;margin-top:11px;font-variant-numeric:tabular-nums;color:#f7ffff}.grid .card:first-child{grid-column:span 2;background:linear-gradient(120deg,#174b4a,#17323e);border-color:#38796f}.grid .card:first-child strong{color:#9bf6d8;font-size:clamp(32px,6vw,48px)}.item{padding:17px 2px;border-bottom:1px solid var(--line);line-height:1.65}.item:last-child{border:0}nav{position:fixed;bottom:0;left:0;right:0;background:#102b35f5;backdrop-filter:blur(14px);border-top:1px solid #36545f;display:flex;overflow-x:auto;padding:5px 5px calc(5px + env(safe-area-inset-bottom));box-shadow:0 -12px 30px #00000033}nav button{min-width:104px;flex:1;background:transparent;color:#a9c2c8;border:0;border-radius:10px;padding:13px 9px;font:inherit;font-size:12px;cursor:pointer;transition:background .2s,color .2s}nav button[aria-current="page"]{color:#7ef2d4;background:#1c4449;font-weight:700}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}main button{background:#5de1c3;color:#092329;border:0;border-radius:10px;padding:12px 16px;font-weight:700;cursor:pointer}table{width:100%;border-collapse:collapse}td,th{padding:14px 5px;border-bottom:1px solid var(--line);text-align:left}th{color:var(--muted);font-size:12px;font-weight:600}th:last-child,td:last-child{text-align:right;font-variant-numeric:tabular-nums}@media(min-width:780px){main{padding-top:36px}.grid{grid-template-columns:repeat(4,minmax(0,1fr))}.grid .card:first-child{grid-column:span 2}nav{left:50%;right:auto;transform:translateX(-50%);width:min(820px,100%);border:1px solid var(--line);border-bottom:0;border-radius:18px 18px 0 0}}@media(prefers-reduced-motion:reduce){nav button{transition:none}}
</style></head><body><header><div class="heading"><div><div class="brand">◈ Commerce workspace</div><h1>DataCore AI</h1><small id="subtitle">Dashboard</small></div><span class="status">● DEMO</span></div></header><main><div class="banner">Modo demostración · Datos ficticios · Sin conexión a SQL Server ni a Groq.</div><section id="content" aria-live="polite"></section></main><nav aria-label="Secciones" id="nav"></nav><script>
const products=[["Polo algodón",39.9,12],["Jean clásico",89.9,4],["Casaca urbana",149.9,2],["Camisa lino",69.9,8]];
const pages={
"Dashboard":()=>'<h2>Resumen comercial</h2><div class="grid"><div class="card">Ingresos demo<strong>S/ 1,347.70</strong></div><div class="card">Unidades vendidas<strong>83</strong></div><div class="card">Ventas<strong>7</strong></div><div class="card">Alertas stock<strong>3</strong></div></div><p class="muted">Indicadores ilustrativos de una semana ficticia.</p>',
"Productos":()=>'<h2>Catálogo</h2>'+products.map(p=>'<div class="item"><b>'+p[0]+'</b><div class="muted">S/ '+p[1].toFixed(2)+' · '+p[2]+' unidades</div></div>').join(''),
"Ventas":()=>'<h2>Ventas</h2><div class="card">Esta demostración es de solo lectura. No registra ni cobra ventas.</div><div class="item">Venta DEMO-001 · S/ 189.80</div><div class="item">Venta DEMO-002 · S/ 149.90</div>',
"Inventario":()=>'<h2>Inventario</h2><table><thead><tr><th>Producto</th><th>Existencias</th></tr></thead><tbody>'+products.map(p=>'<tr><td>'+p[0]+'</td><td>'+p[2]+'</td></tr>').join('')+'</tbody></table>',
"Reportes":()=>'<h2>Reportes</h2><div class="card">Ingresos de ejemplo: S/ 1,347.70</div><p><button type="button" id="csv-export" onclick="downloadDemoCsv()">Exportar CSV de ejemplo</button></p><p class="muted">Exportación CSV de demostración disponible. PDF pendiente.</p>',
"Asistente IA":()=>'<h2>Asistente IA</h2><div class="card">El asistente real no está conectado. Esta pantalla no envía información a servicios externos.</div><p>Ejemplo: ¿Cuántas ventas hubo?</p><p class="muted">Respuesta de demostración: 7 ventas ficticias.</p>'
};
function downloadDemoCsv(){const lines=['Producto,Precio_Soles,Stock',...products.map(p=>[p[0],p[1].toFixed(2),p[2]].join(','))];const blob=new Blob(['\uFEFF'+lines.join('\r\n')],{type:'text/csv;charset=utf-8'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='datacore_demo_inventario.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
const nav=document.querySelector('#nav'),content=document.querySelector('#content');
function show(name){content.innerHTML=pages[name]();document.querySelector('#subtitle').textContent=name;[...nav.children].forEach(b=>b.setAttribute('aria-current',b.textContent===name?'page':'false'));if(location.hash.slice(1)!==encodeURIComponent(name))location.hash=encodeURIComponent(name)}
Object.keys(pages).forEach(name=>{const b=document.createElement('button');b.textContent=name;b.type='button';b.onclick=()=>show(name);nav.appendChild(b)});
function currentPage(){try{const p=decodeURIComponent(location.hash.slice(1));return pages[p]?p:'Dashboard'}catch{return 'Dashboard'}}
window.addEventListener('hashchange',()=>show(currentPage()));show(currentPage());
if('serviceWorker'in navigator&&location.protocol==='https:')navigator.serviceWorker.register('./sw.js').catch(()=>{});
</script></body></html>
