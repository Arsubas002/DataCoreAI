name: Atlas y contrato SQL original
on: [push, pull_request]
permissions:
  contents: read
concurrency:
  group: atlas-sql-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  isolated:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
            backend/constraints-tested.txt
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: pwa/package-lock.json
      - run: python -m pip install -c backend/constraints-tested.txt -r backend/requirements-dev.txt
      - run: python -m pip check
      - run: python -m unittest discover -s backend/tests -v
      - run: python scripts/sql_original.py --check-public
      - run: npm ci --prefix pwa
      - run: npm test --prefix pwa
      - run: python -m unittest discover -s pwa/tests -v
      - run: node pwa/build.mjs
      - run: git diff --check
