<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <meta name="theme-color" content="#141613" />
    <meta
      name="description"
      content="DataCore AI. Una perspectiva clara de tu negocio. Demostración con datos ficticios."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta
      name="apple-mobile-web-app-status-bar-style"
      content="black-translucent"
    />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/apple-touch-icon.png" />
    <link rel="stylesheet" href="./styles.css?v=atlas-sql-v1" />
    <meta name="datacore-release" content="atlas-sql-v1" />
    <title>Inicio · DataCore AI</title>
  </head>
  <body>
    <a class="skip-link" href="#view">Ir al contenido</a>
    <aside class="sidebar" aria-label="Espacio de trabajo">
      <a class="brand" href="#inicio"
        ><span class="brand-mark" aria-hidden="true">d<span>c</span></span
        ><span>DataCore<span class="brand-ai"> AI</span></span></a
      >
      <div class="workspace">
        <span class="workspace-icon" aria-hidden="true">◈</span>
        <div><strong>Mi negocio</strong><small>SQL original / copia</small></div>
        <span class="workspace-dot" aria-hidden="true"></span>
      </div>
      <p class="nav-label">ATLAS / FUENTE SQL</p>
      <nav id="desktop-nav" aria-label="Navegación principal"></nav>

      <div class="sidebar-footer">
        <span class="avatar">DC</span>
        <div>
          <strong>DataCore Studio</strong><small>Scripts · Sin conexión SQL</small>
        </div>
      </div>
    </aside>
    <div class="app-shell">
      <header class="toolbar">
        <a class="mobile-brand" href="#inicio">DataCore <span>AI</span></a>
        <div class="breadcrumb">
          Mi negocio <span>/</span> <strong id="breadcrumb">Inicio</strong>
        </div>
        <div class="global-search" role="search" aria-label="Búsqueda global">
          <label for="global-search" class="sr-only"
            >Buscar productos, inventario y secciones</label
          >
          <div class="global-search-field">
            <span id="search-symbol" aria-hidden="true"></span
            ><input
              id="global-search"
              type="search"
              placeholder="Buscar productos, stock, ventas…"
              autocomplete="off"
              aria-controls="global-results"
            /><kbd>⌘ K</kbd
            ><button
              id="search-clear"
              type="button"
              aria-label="Cerrar búsqueda"
              hidden
            >
              ×
            </button>
          </div>
          <section
            id="global-results"
            class="global-results"
            aria-label="Resultados de búsqueda"
            hidden
          >
            <p id="search-status" role="status"></p>
            <div id="search-matches"></div>
          </section>
        </div>
        <div class="toolbar-actions">
          <span class="demo-label"><i></i>Scripts originales</span
          ><span id="network-status" role="status"></span
          ><button
            class="icon-button"
            id="theme-toggle"
            aria-label="Cambiar tema"
          ></button>
        </div>
      </header>
      <main id="view" tabindex="-1"></main>
      <footer class="page-footer">
        <span>La fuente, siempre a la vista.</span
        ><span>DataCore AI · Fuente SQL · <small>Atlas / SQL original</small></span>
      </footer>
    </div>
    <nav id="mobile-nav" class="mobile-nav" aria-label="Navegación móvil"></nav>
    <dialog id="sheet" aria-labelledby="sheet-title">
      <div class="sheet-handle" aria-label="Arrastrar para cerrar"></div>
      <header class="sheet-header">
        <span class="eyebrow" id="sheet-context">EXPLORAR</span
        ><button
          class="icon-button"
          id="sheet-close"
          aria-label="Cerrar panel"
        ></button>
      </header>
      <div id="sheet-body"></div>
    </dialog>
    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./js/app.js?v=atlas-sql-v1"></script>
  </body>
</html>
